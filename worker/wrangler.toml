name = "mycloud-share"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "mycloud-share"

[vars]
MAX_BYTES = "104857600"      # 100 MB (limite de body do plano gratuito)
DEFAULT_TTL_DAYS = "7"
MAX_TTL_DAYS = "30"

# Segredo (não vai neste arquivo):  npx wrangler secret put UPLOAD_TOKEN
